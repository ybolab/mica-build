# The gates this repository already defines, executed on every push.
#
# It runs `mosd/hack/check.sh` and the `make` targets rather than restating
# what they do. That is deliberate and it is the whole design: a workflow that
# spelled out `cargo clippy -- -D warnings` here would be a second copy of the
# gate definition, free to drift from the one a developer runs locally, and the
# drift would be invisible until the two disagreed about a commit. There is one
# definition of "checked", in the tree, and this file only decides when it runs.
#
# Scope, stated rather than implied: the three targets that need root or
# privileged docker -- os-dbus-policy-test, os-repart-test and the image
# assembly/verification pair -- are NOT run here. They need a runner with those
# privileges, and a runner that silently lacked them would turn a skipped proof
# into a green tick. They stay manual until such a runner exists; see the job
# summary each run prints.

name: check

on:
  push:
    # A PR head that is also pushed would otherwise run every gate twice per
    # commit; push covers main, pull_request covers everything aimed at it.
    branches: [main]
  pull_request:

# A superseded run proves nothing about the commit that replaced it; cancel it
# rather than spend the runner finishing an answer nobody will read.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # cargo fmt --check, clippy -D warnings, nextest, and cargo-deny -- all four
  # via the script, in the order it fixes.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner label promises an OS, not a toolchain: `ring` in Cargo.lock
      # compiles C, so a missing cc would fail deep inside a cargo build with a
      # far worse message than this step's. No `|| true`: a runner that cannot
      # install its own build deps must go red here, not green later.
      #
      # `dbus-daemon` is a TEST dependency, listed here for the same reason as
      # the compiler. Three suites in the nextest run below -- mosd/tests/bus.rs,
      # mosd/tests/scan.rs and mosd/tests/tree.rs -- stand up a private
      # `dbus-daemon --session`, and scan.rs and bus.rs panic by name rather
      # than skip when it is absent. Provisioning it is what makes those suites
      # actually run here; without it they would either go red (scan.rs, bus.rs)
      # or report green while asserting nothing (tree.rs). The package name is
      # `dbus-daemon`: on Ubuntu 24.04+ `dbus-bin` ships dbus-send and
      # dbus-monitor but NOT /usr/bin/dbus-daemon, which was verified against
      # the ubuntu 22.04, 24.04 and 26.04 images before this line was written.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git make bash dbus-daemon

      # The install above is a claim; this is the proof. A runner whose image
      # already carried a different dbus, or whose package silently shipped no
      # daemon, would otherwise surface as a confusing failure inside a Rust
      # test rather than here.
      - name: Prove dbus-daemon can start a session bus
        run: |
          set -euo pipefail
          command -v dbus-daemon
          dbus-daemon --version | head -1
          address=$(dbus-daemon --session --print-address=1 --fork | head -1)
          [ -n "$address" ] || { echo "dbus-daemon printed no session address" >&2; exit 1; }
          echo "session bus address: $address"

      # Pinned to the workspace manifest rather than to a literal: the MSRV
      # lives in mosd/Cargo.toml, and a second copy here could disagree with it.
      # Reading it back is also the only thing that makes `rust-version` an
      # enforced claim rather than documentation.
      - name: Resolve the toolchain from the workspace MSRV
        id: msrv
        run: |
          set -euo pipefail
          version=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' mosd/Cargo.toml | head -1)
          [ -n "$version" ] || { echo "no rust-version in mosd/Cargo.toml" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "workspace MSRV: $version"

      # `--component` is repeated once per component: rustup-init treats one
      # flag with two space-separated words as a component literally named
      # "rustfmt clippy", which it resolves to nothing without failing loudly.
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal \
                --default-toolchain "${{ steps.msrv.outputs.version }}" \
                --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"

      # Prebuilt release binaries, not `cargo install`: compiling cargo-deny
      # from source under the workspace MSRV toolchain took minutes per run and
      # broke whenever a transitive dependency out-raced that MSRV. Versions
      # and sha256 sums are pinned to the exact artifacts proven against this
      # repository on the maintainer's machine (cargo-deny 0.19.5,
      # cargo-nextest 0.9.133); the sums were computed from the official
      # release downloads, and both binaries were executed to confirm they
      # report those versions. cargo-deny publishes its Linux binary only for
      # the musl triple -- it is static, so it runs on the gnu runner as-is.
      - name: Install cargo-nextest and cargo-deny (pinned prebuilt binaries)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          deny_ver=0.19.5
          deny_sha=5ea64ae09959b5fe1072d898f95caaa89b374678ba6728d5e9ed1366745479b0
          curl -sSfL -o "$tmp/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${deny_ver}/cargo-deny-${deny_ver}-x86_64-unknown-linux-musl.tar.gz"
          echo "${deny_sha}  $tmp/cargo-deny.tar.gz" | sha256sum -c -
          tar xzf "$tmp/cargo-deny.tar.gz" -C "$tmp"
          install -m 0755 "$tmp/cargo-deny-${deny_ver}-x86_64-unknown-linux-musl/cargo-deny" \
            "$HOME/.cargo/bin/cargo-deny"

          nextest_ver=0.9.133
          nextest_sha=a9f992321e8759818400d93abb9477b4b11422d18d216e8d208505bd73454103
          curl -sSfL -o "$tmp/cargo-nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${nextest_ver}/cargo-nextest-${nextest_ver}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${nextest_sha}  $tmp/cargo-nextest.tar.gz" | sha256sum -c -
          tar xzf "$tmp/cargo-nextest.tar.gz" -C "$tmp"
          install -m 0755 "$tmp/cargo-nextest" "$HOME/.cargo/bin/cargo-nextest"

          cargo deny --version
          cargo nextest --version

      # The gate itself. Nothing above this line asserts anything about the
      # code; nothing below it is a check this file invented.
      - name: mosd/hack/check.sh
        run: bash mosd/hack/check.sh

  # The suites that need neither root nor docker. Each one fails loudly when it
  # cannot run rather than skipping, so a missing dependency here surfaces as a
  # red job and not as a quiet pass.
  offline-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same reasoning as the rust job: the suites are bash + make, and the
      # runner label guarantees neither. Fail-loud, no `|| true`.
      - name: Install suite dependencies
        run: |
          set -euo pipefail
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends bash make ca-certificates git

      - name: Both document indexes agree with the tree, in both directions
        run: make docs-verify docs-verify-test

      - name: Health gate, machine-id oneshot, and their overlay copies
        run: make os-health-test

      - name: The STATE /etc/shadow reconciler
        run: make os-shadow-test

      - name: The custom-UI location assertions, and that they can fail
        run: make os-ui-location-test

      - name: What this workflow does not cover
        if: always()
        run: |
          echo "Not run here (needs root or privileged docker):" >&2
          echo "  make os-dbus-policy-test   real dbus-daemon, drops to uid 65534" >&2
          echo "  make os-repart-test        privileged docker, loop devices" >&2
          echo "  make os-image-cx3576-v2 / os-verify-cx3576-v2   image assembly and verification" >&2
          echo "Not run here (board artifact builds; cross toolchains and BSP trees):" >&2
          echo "  make cx3576-uboot / cx3576-kernel / cx3576-image" >&2
          echo "Not run here (bash only, needs neither bun nor docker; simply not wired yet):" >&2
          echo "  make os-shell-pipefail-lint" >&2

  # The os/verify bun+TypeScript suite, and the board-definition schema lint
  # that now lives inside it. A SEPARATE JOB rather than a step in
  # offline-suites, because that job's first sentence is that its suites need
  # neither root nor docker, and this one needs docker. A scope statement that
  # quietly stopped being true would be worse than an extra job.
  #
  # WHICH BUN CI RUNS IS THE PIN DECISION, and the decision is: none. No bun is
  # installed here. The runner has none of its own, so os/verify/run.sh takes
  # its container route and runs the bun pinned by digest as IMAGE_BUN_1 in
  # os/build-env/images.env -- the same bun a developer without one gets, and
  # the same one on every push regardless of what a runner image happens to
  # ship. Installing bun instead would have meant either a floating
  # `curl bun.sh/install` -- the loosest kind of reference this campaign spent
  # R6 removing -- or a second pin, in a second place, free to disagree with the
  # first. This way the tool-less-host path is not a claim tested once by hand;
  # it is the path CI takes, so it goes red the day it stops working.
  #
  # THIS IS A COVERAGE INCREASE, not a like-for-like replacement. Neither
  # os-layout-lint nor os-layout-lint-test ran here before, so the
  # board-definition schema is checked on push for the first time; and since the
  # lint's 42 cases live in the same suite, os-verify-test covers them too.
  os-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install suite dependencies
        run: |
          set -euo pipefail
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends bash make ca-certificates git

      # The precondition, asserted rather than assumed. A runner that HAD a bun
      # would run the suite on that bun and pass, and the pinned container --
      # the thing this job exists to exercise -- would never be touched: a green
      # tick about something other than what it claims. A runner with no docker
      # would fail deep inside run.sh instead of here. Both are named now.
      - name: This runner has no bun, which is what makes the next steps a proof
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || {
            echo "error: no docker on this runner. os/verify runs bun in the container pinned as" >&2
            echo "       IMAGE_BUN_1 in os/build-env/images.env, and there is no other bun here." >&2
            exit 1
          }
          docker version --format 'docker {{.Server.Version}}'
          if command -v bun >/dev/null 2>&1; then
            echo "error: this runner already has bun at $(command -v bun)." >&2
            echo "       os/verify would use it and the pinned container would go unexercised, so this" >&2
            echo "       job would report green about a route it never took. Either remove it, or set" >&2
            echo "       MOS_VERIFY_CONTAINER=1 on the steps below so the pin is still what runs." >&2
            exit 1
          fi
          # EXACTLY what run.sh's discovery tests -- an executable at
          # $HOME/.bun/bin/bun -- and not `[ -e "$HOME/.bun" ]`. Driven from the
          # failing side: `bun install` creates $HOME/.bun/install/cache as a
          # side effect even when the binary lives elsewhere, so the looser test
          # rejects a runner that is genuinely bun-less. A precondition that is
          # stricter than the rule it guards fails honest runs.
          if [ -x "$HOME/.bun/bin/bun" ]; then
            echo "error: $HOME/.bun/bin/bun exists; run.sh prefers it over the container." >&2
            echo "       Same problem as a bun on PATH: the pin would go unexercised." >&2
            exit 1
          fi
          echo "no bun on PATH and none at ~/.bun/bin/bun: os/verify takes its pinned-container route"

      # `tee` and then grep the announce line, rather than trusting the exit
      # status alone: a pass proves the suite ran, and this proves WHICH bun ran
      # it. The reference is resolved by from.sh, the one resolver, so this
      # assertion cannot drift from the pin the way a literal here would.
      # The count is deliberately NOT in this name. It was "(108 tests)" and M4a
      # took it to 207; a number in a step name is a number nobody re-runs the
      # job to check, and this campaign has spent whole tasks on counts that
      # broke the moment a suite was widened. run.sh prints the real one.
      - name: The os/verify suite, in the pinned bun container
        run: |
          set -euo pipefail
          image="$(bash os/build-env/from.sh --ref IMAGE_BUN_1)"
          make os-verify-test 2>&1 | tee /tmp/os-verify.log
          grep -qF "in ${image} (no bun on this host)" /tmp/os-verify.log || {
            echo "error: the suite passed, but not in the pinned container." >&2
            echo "       Expected an announce line naming ${image}; os/verify/run.sh prints one on" >&2
            echo "       every run and it is the only thing that says which bun produced the result." >&2
            exit 1
          }

      # The shipped board definitions themselves, which the suite does not check
      # -- it checks the checker. Both boards, 26 assertions.
      - name: Both shipped board layouts against the schema
        run: make os-layout-lint

      - name: What this job does not cover
        if: always()
        run: |
          echo "This job runs bun ONLY as the digest pinned in os/build-env/images.env." >&2
          echo "It therefore does not check that os/verify works on any other bun --" >&2
          echo "including whatever bun a developer has on PATH, which is the route" >&2
          echo "run.sh prefers locally." >&2
          echo >&2
          echo "It also does not run make os-verify-parity (PLAN-014 M4). That target" >&2
          echo "needs a BUILT IMAGE for each board, docker, and a bun on the host --" >&2
          echo "run.sh refuses --parity on the container route, because the harness" >&2
          echo "drives docker itself and the pinned bun image has no docker client." >&2
          echo "None of those hold here. The port's own suite (parity.ts, image.ts," >&2
          echo "tools.ts and their cases) DOES run above; what is untested on this" >&2
          echo "runner is the comparison against a real image." >&2
