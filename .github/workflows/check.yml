# The gates this repository already defines, executed on every push.
#
# It runs `pkgs/mosd/hack/check.sh` and the `make` targets rather than restating
# what they do. That is deliberate and it is the whole design: a workflow that
# spelled out `cargo clippy -- -D warnings` here would be a second copy of the
# gate definition, free to drift from the one a developer runs locally, and the
# drift would be invisible until the two disagreed about a commit. There is one
# definition of "checked", in the tree, and this file only decides when it runs.
#
# Scope, stated rather than implied: the three targets that need root or
# privileged docker -- os-dbus-policy-test, os-repart-test and the image
# assembly/verification pair -- are NOT run here. They need a runner with those
# privileges, and a runner that silently lacked them would turn a skipped proof
# into a green tick. They stay manual until such a runner exists; see the job
# summary each run prints.

name: check

on:
  push:
    # A PR head that is also pushed would otherwise run every gate twice per
    # commit; push covers main, pull_request covers everything aimed at it.
    branches: [main]
  pull_request:

# A superseded run proves nothing about the commit that replaced it; cancel it
# rather than spend the runner finishing an answer nobody will read.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # cargo fmt --check, clippy -D warnings, nextest, and cargo-deny -- all four
  # via the script, in the order it fixes.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner label promises an OS, not a toolchain: `ring` in Cargo.lock
      # compiles C, so a missing cc would fail deep inside a cargo build with a
      # far worse message than this step's. No `|| true`: a runner that cannot
      # install its own build deps must go red here, not green later.
      #
      # `dbus-daemon` is a TEST dependency, listed here for the same reason as
      # the compiler. Three suites in the nextest run below -- pkgs/mosd/mosd/tests/bus.rs,
      # pkgs/mosd/mosd/tests/scan.rs and pkgs/mosd/mosd/tests/tree.rs -- stand up a private
      # `dbus-daemon --session`, and scan.rs and bus.rs panic by name rather
      # than skip when it is absent. Provisioning it is what makes those suites
      # actually run here; without it they would either go red (scan.rs, bus.rs)
      # or report green while asserting nothing (tree.rs). The package name is
      # `dbus-daemon`: on Ubuntu 24.04+ `dbus-bin` ships dbus-send and
      # dbus-monitor but NOT /usr/bin/dbus-daemon, which was verified against
      # the ubuntu 22.04, 24.04 and 26.04 images before this line was written.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git make bash dbus-daemon

      # The install above is a claim; this is the proof. A runner whose image
      # already carried a different dbus, or whose package silently shipped no
      # daemon, would otherwise surface as a confusing failure inside a Rust
      # test rather than here.
      - name: Prove dbus-daemon can start a session bus
        run: |
          set -euo pipefail
          command -v dbus-daemon
          dbus-daemon --version | head -1
          address=$(dbus-daemon --session --print-address=1 --fork | head -1)
          [ -n "$address" ] || { echo "dbus-daemon printed no session address" >&2; exit 1; }
          echo "session bus address: $address"

      # Pinned to the workspace manifests rather than to a literal: the MSRV
      # lives in each Cargo.toml, and a second copy here could disagree with it.
      # Reading it back is also the only thing that makes `rust-version` an
      # enforced claim rather than documentation.
      #
      # There are TWO manifests since split rauc-sign into its own
      # workspace, and this job installs ONE toolchain. So the two MSRVs are not
      # merely read, they are required to AGREE: taking the higher of the two
      # would silently let a crate claim an MSRV this job never actually proves,
      # and taking the first would let the other drift unnoticed. If they should
      # ever legitimately differ, that is the point at which this job needs two
      # toolchains, and this check is what says so.
      - name: Resolve the toolchain from the workspace MSRVs
        id: msrv
        run: |
          set -euo pipefail
          read_msrv() {
            local v
            v=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' "$1" | head -1)
            [ -n "$v" ] || { echo "no rust-version in $1" >&2; exit 1; }
            echo "$v"
          }
          mosd_msrv=$(read_msrv pkgs/mosd/Cargo.toml)
          sign_msrv=$(read_msrv pkgs/rauc-sign/Cargo.toml)
          [ "$mosd_msrv" = "$sign_msrv" ] || {
            echo "error: the two workspaces disagree about the MSRV." >&2
            echo "       pkgs/mosd/Cargo.toml:         $mosd_msrv" >&2
            echo "       pkgs/rauc-sign/Cargo.toml:    $sign_msrv" >&2
            echo "       This job installs one toolchain and runs both gates on it, so it" >&2
            echo "       cannot honour two MSRVs. Reconcile them, or split this job." >&2
            exit 1
          }
          echo "version=$mosd_msrv" >>"$GITHUB_OUTPUT"
          echo "workspace MSRV (both manifests agree): $mosd_msrv"

      # `--component` is repeated once per component: rustup-init treats one
      # flag with two space-separated words as a component literally named
      # "rustfmt clippy", which it resolves to nothing without failing loudly.
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal \
                --default-toolchain "${{ steps.msrv.outputs.version }}" \
                --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"

      # Prebuilt release binaries, not `cargo install`: compiling cargo-deny
      # from source under the workspace MSRV toolchain took minutes per run and
      # broke whenever a transitive dependency out-raced that MSRV.
      #
      # THE VERSIONS AND HASHES ARE build-env/images.env's, sourced and not
      # repeated. They used to be four literals in this file, which was the only
      # place that had them; then the local gate grew an image that installs the
      # same two tools (build-env/rust-check/Dockerfile), and two pins for one
      # tool in two files are "a second pin, in a second place, free to disagree
      # with the first" -- this workflow's own argument, made two jobs below
      # about bun. So RUSTCHECK_* is the single statement of what this gate runs,
      # and a bump is one edit that moves CI and the local image together.
      #
      # cargo-deny publishes its Linux binary only for the musl triple, and
      # images.env pins the musl nextest for the same reason: both are static,
      # so they run on this gnu runner as-is.
      #
      # The archive's inner directory is derived from the URL rather than spelled
      # out, so the triple appears once.
      - name: Install cargo-nextest and cargo-deny (pinned in build-env/images.env)
        run: |
          set -euo pipefail
          # The same comment-stripped derivation build-env/build.sh uses, so the
          # lock means the same thing to a reader of either.
          . <(sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' build-env/images.env)
          for k in RUSTCHECK_DENY_URL_AMD64 RUSTCHECK_DENY_SHA256_AMD64 \
                   RUSTCHECK_NEXTEST_URL_AMD64 RUSTCHECK_NEXTEST_SHA256_AMD64; do
            [ -n "${!k:-}" ] || {
              echo "error: build-env/images.env defines no $k, so this job would install that tool unpinned" >&2
              exit 1
            }
          done

          mkdir -p "$HOME/.cargo/bin"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          curl -sSfL -o "$tmp/cargo-deny.tar.gz" "$RUSTCHECK_DENY_URL_AMD64"
          echo "${RUSTCHECK_DENY_SHA256_AMD64}  $tmp/cargo-deny.tar.gz" | sha256sum -c -
          tar xzf "$tmp/cargo-deny.tar.gz" -C "$tmp"
          install -m 0755 \
            "$tmp/$(basename "$RUSTCHECK_DENY_URL_AMD64" .tar.gz)/cargo-deny" \
            "$HOME/.cargo/bin/cargo-deny"

          curl -sSfL -o "$tmp/cargo-nextest.tar.gz" "$RUSTCHECK_NEXTEST_URL_AMD64"
          echo "${RUSTCHECK_NEXTEST_SHA256_AMD64}  $tmp/cargo-nextest.tar.gz" | sha256sum -c -
          tar xzf "$tmp/cargo-nextest.tar.gz" -C "$tmp"
          install -m 0755 "$tmp/cargo-nextest" "$HOME/.cargo/bin/cargo-nextest"

          cargo deny --version
          cargo nextest --version

      # The gates themselves. Nothing above this line asserts anything about the
      # code; nothing below it is a check this file invented.
      - name: pkgs/mosd/hack/check.sh
        run: bash pkgs/mosd/hack/check.sh

      # The SECOND cargo workspace, and the reason it needs its own step: until
      # Before the split, this crate was a member of the mosd workspace, reached by a
      # `../` entry in pkgs/mosd/Cargo.toml's members list, so the `--workspace` flags
      # inside the script above covered it. The extraction ended that. A `--workspace`
      # that no longer spans a crate does not complain -- it simply checks less
      # and still exits 0 -- so without this step the crate would ship
      # unchecked with this whole job still green.
      - name: pkgs/rauc-sign/hack/check.sh
        run: bash pkgs/rauc-sign/hack/check.sh

      # The gate above already runs the in-tree test that compares the
      # committed document against the generated one, so this step catches no
      # drift that test misses. What it adds is the `--openapi` FLAG PATH: the
      # argv handling in `main()`, above daemon initialisation, which the test
      # bypasses by calling the generator function directly. A flag that
      # stopped printing the document, or started reaching for the bus before
      # it did, leaves that test green and the documented regeneration command
      # broken.
      #
      # `pkgs/mosd/hack/check.sh` cds into `pkgs/mosd/`; this step runs from the
      # repository root, hence `--manifest-path`.
      - name: The committed OpenAPI document is what the shipped flag prints
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          MOS_APID_UI_DIST_DIR="$PWD/_out/apid-ui/dist" \
            cargo run --locked --manifest-path pkgs/mosd/Cargo.toml -p apid -- --openapi \
            >"$tmp/openapi.json"
          diff -u pkgs/mosd/apid/openapi.json "$tmp/openapi.json" || {
            echo "error: pkgs/mosd/apid/openapi.json is not what apid --openapi prints." >&2
            echo "       Regenerate it from pkgs/mosd/:" >&2
            echo "         bash apid/ui/build.sh" >&2
            echo '         MOS_APID_UI_DIST_DIR="$PWD/../../_out/apid-ui/dist" cargo run -p apid -- --openapi > apid/openapi.json' >&2
            exit 1
          }
          echo "pkgs/mosd/apid/openapi.json matches apid --openapi"

  # Offline suites without Docker; DATA initialization also runs as root.
  # Each one fails loudly when it
  # cannot run rather than skipping, so a missing dependency here surfaces as a
  # red job and not as a quiet pass.
  offline-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same reasoning as the rust job: the suites are bash + make, and the
      # runner label guarantees neither. Fail-loud, no `|| true`.
      - name: Install suite dependencies
        run: |
          set -euo pipefail
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends bash make ca-certificates git binutils file

      - name: docs/README.md and the design tree agree, in both directions
        run: make docs-verify docs-verify-test

      - name: Health gate, machine-id oneshot, and their overlay copies
        run: make os-health-test

      - name: Package build preflight and DATA directory initialization
        run: |
          set -euo pipefail
          make os-deb-preflight-test
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO bash tests/mos-data-layout-test.sh

      - name: The STATE /etc/shadow reconciler
        run: make os-shadow-test

      # Belongs in THIS job and not in os-verify: it reads three committed files
      # with bash and git, and needs neither bun nor docker. It is also the only
      # gate here that says anything about a board kernel -- `make cx3576-kernel`
      # is not run on any runner, so without this step the symbols netavark
      # programs rules against are checked by a hardware build or not at all.
      - name: The cx3576 kernel config carries what netavark needs
        run: make os-netavark-kernel-test

      # The build policy of docs/design/build.md section 0 -- no toolchain on
      # the host, no compilation on the host, no assembly on the host -- and
      # the check on that check. HERE and not in the docker jobs for this
      # job's own stated reason: it is bash, awk and git, and it needs
      # neither bun nor docker.
      #
      # BOTH, in this order and as two steps. The lint alone is the shape that
      # went unnoticed for a week elsewhere in this tree: a gate that is green
      # because it stopped matching anything looks exactly like a gate that is
      # green because the tree is clean. The second step is what says the first
      # can still fail, and a failure in it names which control went quiet.
      - name: No compiler or assembler runs on the host
        run: make os-host-toolchain-lint

      - name: ...and that check can still go red
        run: make os-host-toolchain-lint-test

      - name: What this workflow does not cover
        if: always()
        run: |
          echo "Not run here (needs root or privileged docker):" >&2
          echo "  make os-dbus-policy-test   real dbus-daemon, drops to uid 65534" >&2
          echo "  make os-repart-test        privileged docker, loop devices" >&2
          echo "  make os-image-cx3576 / os-verify-cx3576   image assembly and verification" >&2
          echo "Not run here (board artifact builds; cross toolchains and BSP trees):" >&2
          echo "  make cx3576-uboot / cx3576-kernel / cx3576-image" >&2
          echo "Not run here (bash only, needs neither bun nor docker; simply not wired yet):" >&2
          echo "  make os-shell-pipefail-lint" >&2

  # The verify bun+TypeScript suite, and the board-definition schema lint
  # that now lives inside it. A SEPARATE JOB rather than a step in
  # offline-suites, because that job's first sentence is that its suites need
  # neither root nor docker, and this one needs docker. A scope statement that
  # quietly stopped being true would be worse than an extra job.
  #
  # WHICH BUN CI RUNS IS THE PIN DECISION, and the decision is: none. No bun is
  # installed here. The runner has none of its own, so verify/run.sh takes
  # its container route and runs the bun pinned by digest as IMAGE_BUN_1 in
  # build-env/images.env -- the same bun a developer without one gets, and
  # the same one on every push regardless of what a runner image happens to
  # ship. Installing bun instead would have meant either a floating
  # `curl bun.sh/install` -- the loosest kind of reference this campaign spent
  # R6 removing -- or a second pin, in a second place, free to disagree with the
  # first. This way the tool-less-host path is not a claim tested once by hand;
  # it is the path CI takes, so it goes red the day it stops working.
  #
  # THIS IS A COVERAGE INCREASE, not a like-for-like replacement.
  # os-layout-lint did not run here before, so the board-definition schema is
  # checked on push for the first time; and since the lint's 42 cases live in
  # the same suite, os-verify-test covers them too.
  os-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install suite dependencies
        run: |
          set -euo pipefail
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends bash make ca-certificates git

      # The precondition, asserted rather than assumed. A runner that HAD a bun
      # would run the suite on that bun and pass, and the pinned container --
      # the thing this job exists to exercise -- would never be touched: a green
      # tick about something other than what it claims. A runner with no docker
      # would fail deep inside run.sh instead of here. Both are named now.
      - name: This runner has no bun, which is what makes the next steps a proof
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || {
            echo "error: no docker on this runner. verify runs bun in the container pinned as" >&2
            echo "       IMAGE_BUN_1 in build-env/images.env, and there is no other bun here." >&2
            exit 1
          }
          docker version --format 'docker {{.Server.Version}}'
          if command -v bun >/dev/null 2>&1; then
            echo "error: this runner already has bun at $(command -v bun)." >&2
            echo "       verify would use it and the pinned container would go unexercised, so this" >&2
            echo "       job would report green about a route it never took. Either remove it, or set" >&2
            echo "       MOS_VERIFY_CONTAINER=1 on the steps below so the pin is still what runs." >&2
            exit 1
          fi
          # EXACTLY what run.sh's discovery tests -- an executable at
          # $HOME/.bun/bin/bun -- and not `[ -e "$HOME/.bun" ]`. Driven from the
          # failing side: `bun install` creates $HOME/.bun/install/cache as a
          # side effect even when the binary lives elsewhere, so the looser test
          # rejects a runner that is genuinely bun-less. A precondition that is
          # stricter than the rule it guards fails honest runs.
          if [ -x "$HOME/.bun/bin/bun" ]; then
            echo "error: $HOME/.bun/bin/bun exists; run.sh prefers it over the container." >&2
            echo "       Same problem as a bun on PATH: the pin would go unexercised." >&2
            exit 1
          fi
          echo "no bun on PATH and none at ~/.bun/bin/bun: verify takes its pinned-container route"

      # `tee` and then grep the announce line, rather than trusting the exit
      # status alone: a pass proves the suite ran, and this proves WHICH bun ran
      # it. The reference is resolved by from.sh, the one resolver, so this
      # assertion cannot drift from the pin the way a literal here would.
      # The count is deliberately NOT in this name. It was "(108 tests)" and M4a
      # took it to 207; a number in a step name is a number nobody re-runs the
      # job to check, and this campaign has spent whole tasks on counts that
      # broke the moment a suite was widened. run.sh prints the real one.
      - name: The verify suite, in the pinned bun container
        run: |
          set -euo pipefail
          image="$(bash build-env/from.sh --ref IMAGE_BUN_1)"
          make os-verify-test 2>&1 | tee /tmp/os-verify.log
          grep -qF "in ${image} (no bun on this host)" /tmp/os-verify.log || {
            echo "error: the suite passed, but not in the pinned container." >&2
            echo "       Expected an announce line naming ${image}; verify/run.sh prints one on" >&2
            echo "       every run and it is the only thing that says which bun produced the result." >&2
            exit 1
          }

      # The shipped board definitions themselves, which the suite does not check
      # -- it checks the checker. Both boards, 26 assertions.
      - name: Both shipped board layouts against the schema
        run: make os-layout-lint

      # The apid API suite's build-time half. HERE and not in offline-suites,
      # for that job's own stated reason: it needs docker. There is no bun on
      # this runner, so spec-pins.sh takes the same pinned-container route
      # verify does, and its announce line says so.
      #
      # The suite ITSELF (make os-apid-api-test) does not run anywhere in CI:
      # it needs a built image and boots QEMU. That is the whole reason this
      # step exists -- a milestone that moves a shipped status leaves every
      # phase pinning the old one green until somebody boots the image.
      - name: The apid phase pins agree with the committed OpenAPI document
        run: make os-apid-api-spec-pins

      - name: The built-in apid SPA builds as ignored production assets
        run: |
          make os-apid-ui-build-contract-test
          bash pkgs/mosd/apid/ui/run.sh

      - name: What this job does not cover
        if: always()
        run: |
          echo "This job runs bun ONLY as the digest pinned in build-env/images.env." >&2
          echo "The UI source is read-only and every generated file stays below _out/." >&2
          echo >&2
          echo "It also does not run make os-verify-cx3576. That" >&2
          echo "target needs a BUILT IMAGE and docker, and a bun on the host --" >&2
          echo "run.sh refuses --verify on the container route, because the verifier" >&2
          echo "drives docker itself and the pinned bun image has no docker client." >&2
          echo "None of those hold here. The port's own suite (image.ts, tools.ts and" >&2
          echo "their cases) DOES run above; what is untested on this runner is the" >&2
          echo "register against a real image." >&2
          echo >&2
          echo "It does not run make os-apid-api-test either: that suite BOOTS the x64" >&2
          echo "image in QEMU and drives apid over a real socket, and there is no image" >&2
          echo "here. What ran above is its build-time half only -- the phase literals" >&2
          echo "openapi.json also states. Every phase assertion whose only source of" >&2
          echo "truth is the running device is" >&2
          echo "unchecked on this runner and is checked by a booted run or not at all." >&2

  update-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update server quality gate in the pinned Bun container
        run: |
          set -euo pipefail
          image="$(bash build-env/from.sh --ref IMAGE_BUN_1)"
          docker run --rm --label ai-agent=true \
            -v "$PWD/update-server:/source:ro" --tmpfs /check:exec \
            --workdir /check --entrypoint /bin/bash "$image" -c '
              set -euo pipefail
              tar -C /source --exclude=./node_modules --exclude=./.env --exclude=./.data --exclude=./dist -cf - . | tar -xf -
              # mos-build-side: container-block -- this script runs in the digest-pinned Bun image above
              bun install --frozen-lockfile
              bun run check
              bun audit
              # mos-build-side: host
            '
