# The suites check.yml names as out of scope, on a runner that can actually
# run them. check.yml's closing summary lists what it does not cover; this
# workflow is that list, minus nothing invented: the two suites that need root
# or a docker daemon run on every push and PR, and the full image pipeline --
# the only way os-repart-test gets an image to test -- runs on demand and on a
# weekly schedule.
#
# What the `privileged` runner label must provide. The label is a promise, and
# this is the whole promise; a runner registered with this label but missing
# any line below goes red in the preflight steps, not green:
#
#   - Linux x86_64 with apt (the dependency steps use apt-get, like check.yml).
#   - root, either directly or via passwordless sudo, for the suites that
#     mount, loop-attach or drop privileges.
#   - a docker daemon reachable by the job user, with `--privileged`
#     containers permitted (os-repart-test attaches loop devices) and
#     `docker buildx` available (the BSP builds are buildx builds).
#   - linux/arm64 emulation ON THE HOST, for the cx3576 lane:
#       docker run --privileged --rm tonistiigi/binfmt --install arm64
#     This line USED TO SAY the opposite -- that host emulation was not
#     required, because rootfs/build.sh created a docker-container
#     builder with bundled QEMU when the host builder lacked the platform.
#     The rootfs is a CHAIN of one Dockerfile per
#     stage, each `FROM` the local image tag the previous one was written to,
#     and a docker-container builder cannot resolve a local tag -- measured, it
#     reports "pull access denied" about a registry for an image that is
#     present. build.sh now uses the `default` docker-driver builder and
#     refuses up front, naming the binfmt command, if it cannot reach the
#     platform. NOT VERIFIED ON A RUNNER: no arm64-capable host was available
#     to that change, so this is the requirement as analysed, not as observed.
#   - the daemon must be able to bind-mount paths the job writes (the
#     build suite points TMPDIR into the workspace for exactly this;
#     a rootless daemon in a different mount namespace fails its visible-
#     workspace preflight, loudly).
#   - disk: ~10 GiB free for the fast lane; budget >= 50 GiB for the deep lane
#     (kernel + U-Boot source trees and build layers, the assembled image, and
#     the repart test's working copies of it).
#
# Until a runner with this label is registered, Gitea never schedules these
# jobs: the run sits visibly waiting and no green checkmark appears. That is
# Gitea's behavior for an unmatched runs-on label, not a pass -- a reader who
# sees this workflow green has seen it RUN. Nothing here converts "no runner"
# into success.
#
# On docker layer caching: the board Dockerfiles are structured to cache well
# (toolchain and source-clone layers before the build layers), so the deep
# lane's later runs are only as slow as what changed -- IF the runner's docker
# daemon retains its layer cache between runs. Whether it does is a property
# of the runner deployment, not of this file, so this file configures no
# cache; there is no runner-agnostic cache stanza that would be true here
# without having been verified against a real runner.

name: privileged

on:
  push:
    # Same shape as check.yml: push covers main, pull_request covers
    # everything aimed at it, and nothing runs twice per commit.
    branches: [main]
  pull_request:
  # The deep lane's triggers. schedule needs a branch to check out and Gitea
  # runs scheduled workflows against the default branch, which is main.
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

# The event name is part of the group deliberately: with only the ref, a push
# to main would land in the same group as the weekly deep run and cancel five
# hours of image build to re-answer a question the fast lane answers in
# minutes. Superseded runs of the SAME kind still cancel each other, exactly
# as in check.yml.
concurrency:
  group: privileged-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
jobs:
  # The container engine's upstream pin freshness check lives in
  # ybolab/mica-podman with the pins it reads.

  # The two excluded suites that need no BSP artifacts: the dbus policy test
  # stands up its own bus, and the build suite fabricates synthetic fixtures
  # for every input the real pipeline would build. Every push and PR.
  #
  # Not a duplicate of check.yml's dbus-daemon step: the standard lane
  # provisions dbus-daemon so the micad Rust suites can run PRIVATE SESSION
  # buses as an ordinary user. This suite proves the SHIPPED system-bus
  # policy files, and hard-refuses to run without real root because its whole
  # point is what uid 65534 can and cannot do -- which is why it still cannot
  # move to the standard lane.
  root-and-docker-suites:
    runs-on: privileged
    steps:
      - uses: actions/checkout@v4

      # The label promises root and docker; promises are checked before they
      # are leaned on, so a mis-registered runner fails HERE with a message
      # naming the missing capability, not twenty minutes into a suite.
      - name: Preflight the runner label's promises
        run: |
          set -euo pipefail
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO true || { echo "runner is neither root nor passwordless-sudo" >&2; exit 1; }
          docker info >/dev/null || { echo "no reachable docker daemon" >&2; exit 1; }

      # dbus-daemon for the bus under test, util-linux for setpriv, python3
      # for the wire-protocol client the test carries. Fail-loud, no `|| true`:
      # a runner that cannot install its own suite deps must go red here.
      - name: Install suite dependencies
        run: |
          set -euo pipefail
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            bash make git ca-certificates dbus util-linux python3

      # BOTH assemblers against synthetic fixtures: byte-identical reassembly,
      # the full GPT contract, and every guard's negative direction.
      #
      # This step ran tests/mkimage-v2-selftest.sh until later
      # deleted the shell assemblers and the two selftests that
      # drove them. It is REPOINTED rather than removed because os-build-test
      # was not in any workflow: dropping the step would have taken every
      # assembler assertion out of CI, which is the opposite of what deleting
      # a suite at parity is supposed to mean. It covers the x64 assembler and
      # the bundle builder too, which the old step did not.
      #
      # Needs docker (the tool containers). No BSP, no built image, no root.
      - name: make os-build-test
        run: |
          set -euo pipefail
          mkdir -p _out/tmp
          TMPDIR="$PWD/_out/tmp" make os-build-test

  # The full pipeline: BSP kernel and U-Boot, the mos image, its verification,
  # a signed (dev-key) bundle, and os-repart-test against the image just
  # built -- the one suite that cannot run without one. On demand and weekly,
  # not per push: the kernel and U-Boot builds are the long pole and were
  # measured honestly as "hours". Expect the first cold run to take on
  # the order of 3-6 hours on a capable runner; nobody has measured a real
  # runner yet, and this comment should be corrected to the measured figure
  # when one exists. Warm runs are bounded by what the docker layer cache
  # retained (see the header).
  image-pipeline:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: privileged
    # Above the 6h default because the cold kernel build alone may consume
    # most of it; a timeout kill halfway through proves nothing.
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      # Same promise check as the fast lane, plus the two this lane leans on:
      # buildx for the BSP builds and a --privileged container for the loop
      # devices os-repart-test needs. The probe attaches nothing; it asks the
      # daemon to run a privileged container and touch /dev/loop-control,
      # which is exactly the capability the suite will demand later.
      - name: Preflight the runner label's promises
        run: |
          set -euo pipefail
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO true || { echo "runner is neither root nor passwordless-sudo" >&2; exit 1; }
          docker info >/dev/null || { echo "no reachable docker daemon" >&2; exit 1; }
          docker buildx version >/dev/null || { echo "docker buildx is not available" >&2; exit 1; }
          # The probe's base comes from build-env/images.env like every other
          # image in this tree. It runs after actions/checkout, so the resolver
          # is on disk; that ordering is what makes a key usable here at all.
          #
          # AND IT IS A PREFLIGHT OF THE PIN ITSELF, which is worth having this
          # early. If images.env carries a PENDING, a tag where a digest belongs
          # or a malformed digest, this step fails in seconds with from.sh's own
          # message -- rather than the pipeline spending hours on the kernel and
          # U-Boot builds and then failing in the assembler, which is the
          # same defect reported from the far end of the long pole.
          PROBE_IMAGE="$(bash build-env/from.sh --ref IMAGE_ALPINE_3_21)"
          docker run --rm --privileged "${PROBE_IMAGE}" sh -c 'test -e /dev/loop-control && losetup -f >/dev/null' \
            || { echo "the daemon refuses --privileged containers or has no loop devices" >&2; exit 1; }

      - name: Install suite dependencies
        run: |
          set -euo pipefail
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            bash make git ca-certificates

      # THE PRODUCTS. One make product per recipe under products/, the way
      # check.yml's matrix runs them, and then the three checks only this lane
      # can run: the factory-root gate and the smoke negatives execute the
      # root's own binaries (arm64 roots need the emulation this label
      # promises), and the repart test needs loop devices in a --privileged
      # container. No board is named here: a product names its own, and a
      # board pinned tomorrow is covered by its products/ recipe.
      - name: Fetch the source dependencies at their pins
        run: make deps
        env:
          GH_TOKEN: ${{ secrets.MICA_DEPS_TOKEN }}

      - name: The trust material the products are signed with (development, this lane proves the pipeline)
        run: make os-devkeys

      - name: Every product: build, verify, gate, smoke negatives, repart
        run: |
          set -euo pipefail
          for p in $(bash tools/product.sh --list); do
            echo "::group::${p}"
            make product PRODUCT="${p}"
            make product-verify PRODUCT="${p}"
            make os-factory-root-gate PRODUCT="${p}"
            make os-smoke-negative-test PRODUCT="${p}"
            make product-repart-test PRODUCT="${p}"
            echo "::endgroup::"
          done
        env:
          GH_TOKEN: ${{ secrets.MICA_DEPS_TOKEN }}

      # The composed roots, published by this workflow's own token once every
      # product passed: ghcr.io/ybolab/mica-root/<product>:build-<commit12>.
      - name: Every product's root as its image
        run: |
          set -euo pipefail
          for p in $(bash tools/product.sh --list); do make product-release PRODUCT="${p}"; done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MICA_REGISTRY_USER: ${{ github.actor }}
