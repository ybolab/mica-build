# Board metadata — CX3576-Z (Rockchip RK3576).
# Not consumed by any build today: the v2 pipeline (os/mkimage-v2.sh,
# os/update/bundle.sh) hardcodes what it needs. This file is the board's
# human-readable contract until a build step reads it.
name: cx3576
arch: arm64
soc: rk3576
bootChain: uboot-rockchip        # SPL+U-Boot at eMMC sector 64, FIT boot (PLAN-006)
console: ttyFIQ0,1500000
earlycon: uart8250,mmio32,0x2ad40000
storage:
  media: emmc
  device: /dev/mmcblk0
  ubootOffsetSectors: 64
kernel:
  source: armbian/linux-rockchip rk-6.1-rkr5.1
  version: 6.1.115
  dtb: rk3576-cx3576z.dtb
cmdlineExtra: "storagemedia=emmc net.ifnames=0 rootwait"
wifi: [AP6275S-bcmdhd-sdio, AIC8800D80]   # dual SKU; firmware in rootfs/firmware/
features: [wifi, bluetooth, can, emmc]

# Display defaults (design/display.md section 5)
display:
  output: hdmi
  rotation: 0

# Build outputs; paths relative to board/cx3576/. Descriptive metadata only:
# nothing consumes board.yaml today — the Talos image phase this section used
# to feed was retired by PLAN-010, and the current v2 pipeline (os/mkimage-v2.sh,
# os/update/bundle.sh) hardcodes the artifact paths it pulls. Kept as the human-readable
# record of what this board's Makefile produces.
artifacts:
  kernel:
    image: out/kernel/Image
    modules: out/kernel/modules.tar
    dtb: out/kernel/rk3576-src.dtb
  uboot:
    binary: out/uboot/u-boot-rockchip.bin        # debug variant (v1/alpine only)
    binaryMos: out/uboot-mos/u-boot-rockchip.bin # A/B variant, the one the v2 image carries
