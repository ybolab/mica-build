# Bluetooth for cx3576 (dual SKU; BT is HCI-over-UART behind the vendor rfkill
# platform node, not serdev).
# uart: the vendor dtb's wireless-bluetooth node pins its RTS line via the
#   "uart4-gpios" pinctrl and uart4 = serial@2ad70000 (alias serial4, status
#   okay) is the UART wired to the module -> /dev/ttyS4.
# proto: btattach protocol. speed: link rate, only needed by the H:4 path.
#
# Values below are the hardware-verified AIC8800D80 combination taken from the
# board bring-up rootfs: plain H:4 at 1.5 Mbit/s, with the aic8800_btlpm module
# (listed in modules.conf) providing the BT side of the chip.
#
# For the AP6275S SKU switch to the Broadcom patchram path instead:
#   proto=bcm
#   (drop speed=; btattach negotiates it)
# That path loads the patchram blob through the brcm/BCM4362A2.hcd symlink,
# which resolves to the vendor SYN43756B0.hcd shipped in /usr/lib/firmware —
# SYN43756B0 is the Synaptics name for the BCM43752A2 BT core and the btbcm
# driver identifies it as BCM4362A2. Candidate pending on-hardware validation.
uart=/dev/ttyS4
proto=h4
speed=1500000
