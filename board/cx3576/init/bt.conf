# Bluetooth for cx3576 (AP6275S WiFi/BT combo; BT is HCI-over-UART behind the
# vendor rfkill platform node, not serdev).
# uart: the vendor dtb's wireless-bluetooth node pins its RTS line via the
#   "uart4-gpios" pinctrl and uart4 = serial@2ad70000 (alias serial4, status
#   okay) is the UART wired to the module -> /dev/ttyS4.
# proto: btattach protocol (bcm = Broadcom H4 + patchram download).
# firmware: patchram blob shipped in /usr/lib/firmware. SYN43756B0 is the
#   Synaptics name for the BCM43752A2 BT core; the btbcm driver identifies it
#   as BCM4362A2 and requests brcm/BCM4362A2.hcd (symlinked by the image
#   build). Candidate pending on-hardware validation.
uart=/dev/ttyS4
proto=bcm
firmware=SYN43756B0.hcd
