# Board hardware modules for cx3576 (one module name per line).
# The WiFi entries cover the dual SKU: only one chip is fitted per device, and
# the driver for the absent one fails to load and is skipped silently by
# mos-modules. aic8800_btlpm drives the BT core of the AIC8800D80 combo chip
# and must be loaded before mos-bt attaches the HCI.
bcmdhd
aic8800_fdrv
aic8800_btlpm
