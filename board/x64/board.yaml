# Board metadata — generic x86_64 platform (UEFI).
# Not consumed by any build today: the v2 pipeline (os/mkimage-v2.sh,
# os/bundle.sh) hardcodes what it needs and currently targets cx3576 only.
# This file is the board's human-readable contract until a build step reads it.
name: x64
arch: amd64
soc: generic
bootChain: uefi                  # firmware-provided boot chain (systemd-boot / GRUB), no BSP build
console: ttyS0,115200
storage:
  media: generic                 # nvme / sata / virtio
kernel:
  source: none                   # no vendor tree; a stock distro kernel once the v2 image targets x64
cmdlineExtra: ""
features: [uefi, qemu]
