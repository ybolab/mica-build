[workspace]
resolver = "3"
members = ["mosd", "mosd-settings", "busname", "apid", "mqttd", "../update/sign"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# The one `com.mos.*` bus-name rule, shared by every consumer of it
# (PLAN-011 D5).
mos-busname = { path = "busname" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tracing = "0.1"
# env-filter, so RUST_LOG still works. It pulls in regex (~1 MB in the
# binary), and that is the right trade on a device with no shell and no
# package manager: the journal is the only way to see what mosd did, and a
# fixed compile-time level means a field problem cannot be looked at more
# closely without a new image.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
ring = "0.17"
url = "2"
# tough 0.18 is the last release whose crypto backend is `ring`; 0.19+ hard-depend
# on aws-lc-rs, which builds C (AWS-LC). See docs/task/RFCT-016.md.
tough = { version = "=0.18.0", default-features = false }
axum = "0.8"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
argon2 = "0.5"
bcrypt = "0.19"
rand = "0.8"
maud = "0.27"
hmac = "0.12"
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# rumqttc without default features is TCP-only: no TLS, and every remaining
# dependency is pure Rust. The `use-rustls` default would pull tokio-rustls in;
# TLS to the broker is a later decision (docs/task/RFCT-091.md).
rumqttc = { version = "0.25", default-features = false }
