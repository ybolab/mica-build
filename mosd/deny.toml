# cargo-deny 0.19.x configuration for the mosd workspace.

[licenses]
# All workspace crates are publish = false; skip license checks for them.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # tiny-keccak 2.0.2, and only tiny-keccak. CC0-1.0 is a public-domain
    # dedication rather than a licence with obligations, and it is reached
    # here through a proc macro's build-time dependency, not through anything
    # linked into a shipped binary:
    #
    #   rumqttd -> config -> rust-ini -> ordered-multimap -> dlv-list
    #           -> const-random -> const-random-macro -> tiny-keccak
    #
    # `config` is a mandatory dependency of rumqttd, so no feature flag drops
    # the chain; the alternative to allowing this is not using the broker.
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"

[advisories]
# Vulnerabilities are errors by default in the version-2 schema;
# unmaintained advisories only warn.
unmaintained = "all"
ignore = [
    # rustls-pemfile is archived but is a thin wrapper around the identical
    # PEM parsing code in rustls-pki-types; it is a mandatory dependency of
    # axum-server's tls-rustls feature and carries no vulnerability.
    { id = "RUSTSEC-2025-0134", reason = "unmaintained thin wrapper pulled in by axum-server tls-rustls" },
]
