<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- com.mos.mosd is a ROOT-ONLY bus name (RFCT-048).

       The interface behind this name reboots and powers off the appliance,
       rewrites the persisted settings tree, and — since RFCT-033 —
       SetTransientRootPassword writes a root credential straight into
       /etc/shadow. The previous policy was a development skeleton that let any
       local uid send to all of it.

       Every client that speaks to mosd already runs as root: no shipped unit
       sets User=, mosd.service owns the name as root, apid.service and the boot
       health gate both run as root. Restricting the name to root therefore
       closes a hole rather than changing any behaviour that exists.

       receive_sender is restricted TOO, and that is not merely symmetry. The
       interface broadcasts SettingsChanged(path, value_json) carrying the
       settings VALUE. A uid that may not send could still subscribe and read
       every settings change as it happens — including
       access.webAdmin.password_hash the moment an operator sets it. A caller
       who cannot ask can still listen, so both directions are closed.

       Why the default context carries explicit <deny> rather than just
       dropping the old <allow>: the standard system.conf default stanza
       already denies method_call, but it ALLOWS receive_type="signal" for
       everyone. Removing the allow alone would leave SettingsChanged readable
       by any uid on the device. The deny is what actually closes the receive
       side, and it also makes the send side hold independently of whatever the
       base configuration happens to permit.

       EXTENSION POINT — read this before editing.
       If apid (or anything else) ever gains its own non-root user, give it its
       OWN block:

           <policy user="apid">
             <allow send_destination="com.mos.mosd"/>
             <allow receive_sender="com.mos.mosd"/>
           </policy>

       ADD a block. Do NOT reopen the default context. Moving these rules back
       into <policy context="default"> is the easy wrong move: in a diff it
       reads like restoring a line, while it actually re-grants every local uid
       on the device — including whatever unprivileged helper prompted the
       change in the first place. The named-user block grants exactly one
       identity and fails closed for the rest.

       DEFERRED — per-method allowlisting, deliberately not implemented here.
       D-Bus policy can split members with send_interface=/send_member=, so the
       read-only members (GetSettings, GetState) could be separated from the
       mutating ones (SetSettings, Reboot, PowerOff, SetTransientRootPassword,
       ReportHealth). RECOMMENDATION: do the split, but only once a second
       identity actually exists. Today every caller is root, so a per-method
       split would partition one identity against itself — it would add a list
       that has to be kept in step with mosd/mosd/src/bus.rs, and a member
       added there without a matching rule here fails at runtime with an
       AccessDenied that looks nothing like "you forgot the policy". The split
       earns its cost the day a non-root apid needs GetSettings and GetState
       and must NOT reach Reboot or SetTransientRootPassword; that is the point
       at which the extension-point block above should be written with
       send_member= rules instead of a blanket send_destination=. -->

  <policy context="default">
    <deny send_destination="com.mos.mosd"/>
    <deny receive_sender="com.mos.mosd"/>
  </policy>

  <policy user="root">
    <allow own="com.mos.mosd"/>
    <allow send_destination="com.mos.mosd"/>
    <allow receive_sender="com.mos.mosd"/>
  </policy>
</busconfig>
