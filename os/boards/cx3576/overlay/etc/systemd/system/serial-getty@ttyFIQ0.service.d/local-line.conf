# The FIQ debugger tty never reports carrier, so the stock serial-getty
# invocation -- agetty without --local-line -- blocks in open() waiting for
# DCD: the unit shows "Started", no prompt is ever printed, and input is
# never read. The BSP bring-up rootfs proved the working form on the same
# kernel with busybox `getty -L 1500000 ttyFIQ0 vt100`; this drop-in is
# that invocation in agetty spelling. The baud is pinned rather than
# --keep-baud's probe list because the FIQ tty's termios does not reflect
# the hardware rate the console= parameter configured.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' --local-line 1500000 %I vt100
