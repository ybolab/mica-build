# GRUB configuration for the x64 slot pair (os/layout/x64-v2.env).
#
# THE CONTRACT IS THE SAME ONE os/boot/cx3576-boot.cmd IMPLEMENTS FOR U-BOOT,
# and it is stated here so the two can be compared rather than trusted
# separately:
#
#   * RAUC picks the order and owns the counters. It writes ORDER, A_OK/A_TRY
#     and B_OK/B_TRY into grubenv with grub-editenv, exactly as the U-Boot
#     backend writes BOOT_ORDER and BOOT_A_LEFT into the redundant environment.
#   * The bootloader DECREMENTS before handing over, not after. A slot that
#     hangs before the health gate must lose an attempt, or a hang is a
#     permanent hang rather than one bad boot.
#   * The health gate resets the counter after a good boot. Nothing here does.
#
# RAUC is hardware-independent: the bundle, the slot model and the attempt
# contract are the same on both boards. This file exists because the STORAGE of
# those three variables differs -- grubenv here, a redundant U-Boot environment
# there -- and for no other reason.

load_env

# Defaults for a factory image whose grubenv RAUC has never written.
if [ -z "${ORDER}" ]; then set ORDER="A B" ; fi
if [ -z "${A_OK}" ];  then set A_OK=0 ;     fi
if [ -z "${B_OK}" ];  then set B_OK=0 ;     fi
if [ -z "${A_TRY}" ]; then set A_TRY=0 ;    fi
if [ -z "${B_TRY}" ]; then set B_TRY=0 ;    fi

# A slot is bootable when RAUC marked it good, or when it still has an attempt
# left. `A_TRY=0` means "not yet tried this cycle", so the FIRST boot of a
# freshly installed slot is allowed and the second is not -- which is what
# makes a slot that cannot reach the health gate fall back rather than loop.
set default=0
set timeout=3

for SLOT in ${ORDER}; do
    if [ "${SLOT}" = "A" -a "${A_OK}" = "1" ]; then
        set fallback_slot="${fallback_slot} A"
    fi
    if [ "${SLOT}" = "B" -a "${B_OK}" = "1" ]; then
        set fallback_slot="${fallback_slot} B"
    fi
done

menuentry "mos slot A" --id A {
    if [ "${A_OK}" != "1" ]; then
        set A_TRY=1
        save_env A_TRY
    fi
    linux /vmlinuz-a @CMDLINE_A@
    initrd /initrd-a
}

menuentry "mos slot B" --id B {
    if [ "${B_OK}" != "1" ]; then
        set B_TRY=1
        save_env B_TRY
    fi
    linux /vmlinuz-b @CMDLINE_B@
    initrd /initrd-b
}

# The order RAUC asked for, honoured as GRUB's default and fallback. A slot
# that has already been tried once this cycle and not marked good is skipped:
# `default` names the first candidate, `fallback` the second, and GRUB moves on
# when a boot does not complete.
for SLOT in ${ORDER}; do
    if [ "${SLOT}" = "A" -a "${A_OK}${A_TRY}" != "00" -a "${A_OK}" != "1" -a "${A_TRY}" = "1" ]; then
        # tried and not good: leave it out of default
        set skip_a=1
    fi
done

if [ "${skip_a}" = "1" ]; then
    set default="B"
    set fallback="A"
else
    set default="A"
    set fallback="B"
fi
