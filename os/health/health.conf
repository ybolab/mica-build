# mos health gate configuration (board-agnostic, installed to
# /etc/mos/health.conf). `key=value` lines only; `#` comments and blank lines
# are ignored. Every key is optional; the built-in defaults are shown.

# Seconds to wait for systemd to leave `initializing`/`starting` before the
# state is evaluated. The gate polls, so a healthy boot pays nothing.
settle-sec=60

# Per-probe timeout in seconds.
probe-timeout-sec=10

# Failed units tolerated while `systemctl is-system-running` reports
# `degraded`. One `tolerate-failed=<unit>` line per unit; a failed unit that is
# not listed here is a health FAILURE. Empty by default on purpose.
#tolerate-failed=example.service

# /var usage percentage at or above which pressure is reported to mosd as
# `degraded`. This is REPORTED, never fatal: /var is disposable runtime
# residue, and a log flood must not turn into an update rollback.
var-threshold-pct=85
