<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- com.mos.ext.* is the EXTENSION namespace.

       Third-party services own names under com.mos.ext.<class>[.<suffix>].
       They are plain systemd units an integrator installs: mos does not
       register them, does not supervise them, and does not start them. Nothing
       grants them a bus name at install time either, which is what this file
       is for — without it dbus-daemon's default deny leaves every extension
       unable to take its own name, and the failure surfaces as an AccessDenied
       at RequestName that looks nothing like "you forgot the policy".

       WHY THERE IS NO DENY LIST, and why that is a measured fact rather than a
       hopeful one. own_prefix is NOT a string-prefix match: dbus-daemon
       requires the character after the prefix to be '.', so com.mos.extra is
       REFUSED by own_prefix="com.mos.ext" even though it starts with those
       characters. That is precisely why com.mos.mosd is safe here. System
       names fall outside the granted prefix, so D-Bus's own default
       <deny own="*"/> already closes com.mos.mosd and every system name that
       has not been invented yet. Adding a future system service therefore
       costs ZERO edits to this file — that property is why the namespace is
       split this way rather than by enumerating denials, which would have to
       be extended in lockstep forever and would fail open the one time
       somebody forgot. Measured on dbus-daemon 1.12.20; the record is
       Measured against dbus-daemon: own_prefix semantics".

       The bare name com.mos.ext is grantable too — own_prefix matches the
       prefix itself, also measured, so an unprivileged uid can own exactly
       that name. This is ACCEPTED, not overlooked: it sits inside the
       namespace extensions were given and gives away nothing the grant did not
       already intend. It is written down because it is a real, reachable name
       and the alternative is a future reader rediscovering it.

       EXTENSION POINT — read this before editing.
       Do NOT widen this to own_prefix="com.mos". In a diff that reads like a
       simplification — one shorter string, one fewer dot. What it actually
       does is re-grant ownership of com.mos.mosd to every local uid on the
       device. A unit with DefaultDependencies=no could then claim the name
       before mosd does, and apid would spend the rest of the boot talking to
       an impostor that answers GetSettings with whatever it likes. Name
       squatting is the threat this file closes, and ONLY policy can close it:
       mosd's service scan runs after the fact and reports what already owns a
       name — it cannot take one back. If an extension needs a name outside
       com.mos.ext.*, give it its OWN file naming that ONE name; do not widen
       the prefix.

       This file grants OWN ONLY. It adds no send_destination and no
       receive_sender rules. An extension package must grant each client the
       exact service name and members it needs; in particular, MQTT-enabled
       applications grant mos-mqttd their own com.mos.ext.* destination's
       Item1 methods. There is deliberately no namespace-wide client grant:
       dbus-daemon 1.12 cannot express one safely. Nothing here opens
       com.mos.mosd in any direction — that name stays root-only under
       com.mos.mosd.conf, and this file must never be the reason that changes.
       -->

  <policy context="default">
    <allow own_prefix="com.mos.ext"/>
  </policy>
</busconfig>
