<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The MQTT bridge's grant on com.mos.mosd.

       This file OWNS NO BUS NAME. mos-mqttd never calls RequestName: it is a
       client of com.mos.mosd and a client of the broker, and nothing on the
       bus addresses it. The file is named for the unit it grants rather than
       for a name it takes, because there is no name to take.

       WHY IT EXISTS. com.mos.mosd is root-only (com.mos.mosd.conf): the
       default context denies send_destination AND receive_sender. The bridge
       does not run as root — it is the only daemon in the image with a network
       socket, and giving that daemon root to read a settings tree would be the
       wrong trade in the wrong direction. Without a grant it connects to the
       broker and publishes nothing, which is the quietest possible failure:
       the unit is active, the broker shows a client, and no data ever
       arrives.

       WHAT IT GRANTS, AND WHY IT IS PER-MEMBER.
       com.mos.mosd.conf's own DEFERRED note says a per-method split "earns
       its cost the day a non-root [client] needs GetSettings and GetState and
       must NOT reach Reboot or SetTransientRootPassword". That day is this
       file. A blanket <allow send_destination="com.mos.mosd"/> here would let
       the network-facing daemon call Reboot, PowerOff and
       SetTransientRootPassword — the last of which writes a root credential
       into /etc/shadow. So the grant names members.

       The three members are the bridge's ENTIRE bus surface, read from the
       code rather than guessed:
         - com.mos.Item1.GetItems      mqttd/src/source.rs (ItemTree proxy)
         - com.mos.Item1.ItemsChanged  mqttd/src/source.rs (signal, received)
         - com.mos.Item1.SetValue      mqttd/src/source.rs set_value()
       It calls no GetValue: the mirror is built from GetItems and kept in step
       by ItemsChanged. NameOwnerChanged comes from org.freedesktop.DBus, not
       from com.mos.mosd, and the base configuration already allows it.

       WHY SetValue IS GRANTED EVEN THOUGH THE UNIT SHIPS read-only.
       The mode is an operator setting on STATE (MOS_MQTT_MODE in
       /var/lib/mos/mqttd.env) and the root filesystem is immutable, so a
       policy that had to change with the mode would make MOS_MQTT_MODE=full
       unreachable without reflashing. The mode gate is in the bridge
       (config::Mode::writes_allowed, and the read-only path does not even
       subscribe to W topics); this file bounds what the process COULD reach
       if that gate were defeated, and the bound that matters is the one that
       keeps Reboot, PowerOff, SetSettings and SetTransientRootPassword out.

       WHEN A MEMBER IS ADDED TO THE BRIDGE. Add it here too. D-Bus answers an
       ungranted call with AccessDenied, which surfaces as an unreachable-bus
       error inside the bridge and looks nothing like "you forgot the policy".
       The image verifier asserts the granted set against this file, so a
       member added on one side and not the other is caught in the image
       rather than on the device. -->

  <policy user="mos-mqttd">
    <allow send_destination="com.mos.mosd"
           send_interface="com.mos.Item1"
           send_member="GetItems"/>
    <allow send_destination="com.mos.mosd"
           send_interface="com.mos.Item1"
           send_member="SetValue"/>
    <allow receive_sender="com.mos.mosd"
           receive_interface="com.mos.Item1"
           receive_member="ItemsChanged"/>
  </policy>
</busconfig>
