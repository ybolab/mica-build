<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The MQTT bridge's complete grant on the SYSTEM management service.

       mos-mqttd is a non-root, network-facing process. It may obtain only the
       stable device identifier used in MQTT topic addresses. It must not call
       GetSettings/GetState, power, update, credential, health or any other
       management member, and com.mos.mosd no longer exports com.mos.Item1.

       Application data lives under exact
       com.mos.ext.<class>[.<suffix>] names. dbus-daemon 1.12 supports
       own_prefix but has no safe send-destination-prefix rule, so this file
       cannot grant all present and future applications without also granting
       system destinations. Each application package must add an exact-name
       policy block for the mos-mqttd user and only the Item1 members it
       supports. For example, an application-owned policy block can contain:

         <allow send_destination="com.mos.ext.sensor.example"
                send_interface="com.mos.Item1"
                send_member="GetItems"/>
         <allow send_destination="com.mos.ext.sensor.example"
                send_interface="com.mos.Item1"
                send_member="SetValue"/>

       ItemsChanged signals need no additional receive grant under the stock
       system-bus policy. An application without its exact send grant is
       discovered but fails closed with AccessDenied and is not published. -->

  <policy user="mos-mqttd">
    <allow send_destination="com.mos.mosd"
           send_interface="com.mos.mosd1"
           send_member="GetDeviceId"/>
  </policy>
</busconfig>
