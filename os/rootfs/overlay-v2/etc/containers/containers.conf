# mos's own engine configuration. NOT Debian's.
#
# The engine binaries are built from source in os/pkgs/podman, so the distribution's
# containers-common package is not installed and nothing else writes this file.
# Every value below was read out of podman v5.8.6's own source, not copied from
# a packaged config: paths and field names are cited to the file that defines
# them, so the next version bump has something to re-check against.
#
# WHY ONLY /etc AND NOT /usr/share. podman reads containers.conf in layers,
# later overriding earlier (vendor/go.podman.io/common/pkg/config/new.go:173):
#
#     $CONTAINERS_CONF                 (exclusive if set)
#     /usr/share/containers/containers.conf
#     /etc/containers/containers.conf          <- this file
#     /etc/containers/containers.conf.d/*
#     ~/.config/containers/containers.conf
#
# None is required; each is read only if present. Shipping one file at the
# override layer means an integrator reading /etc sees everything mos decided,
# with no second copy in /usr/share that silently supplies the rest.

[containers]
# catatonit by absolute path. The default is a NAME (defaultInitName =
# "catatonit", default.go:37) resolved by searching helper_binaries_dir, so the
# built-in default depends on which of four directories happens to hold a file
# with that name. This image installs exactly one, and says which.
init_path = "/usr/libexec/podman/catatonit"

# journald is ALREADY the default for this build (systemd.go:22 sets
# DefaultLogDriver = "journald" behind the `systemd` build tag, which os/pkgs/podman
# passes). It is written out because that default is a property of a BUILD TAG:
# drop `systemd` from BUILDTAGS and the default silently becomes k8s-file
# (nosystemd.go:7), which writes container logs to the graphroot on DATA
# instead of to the journal on EPHEMERAL. Nothing would report that change.
log_driver = "journald"

[engine]
runtime = "crun"

# Absolute paths for the three binaries podman execs, rather than letting it
# search. The default search lists (default.go:391 for crun, default.go:474 for
# conmon, config_linux.go:24 for the helper dir) all begin under /usr/local:
#
#     helper_binaries_dir: /usr/local/libexec/podman, /usr/local/lib/podman,
#                          /usr/libexec/podman, /usr/lib/podman
#
# On this appliance /usr/local is not a neutral prefix -- the extension design makes
# /usr/local/lib/systemd/system a STATE-backed writable bind. The sibling
# directories are still read-only squashfs today, so this is not a live hole;
# it is a search order that puts writable-adjacent paths ahead of the image's
# own binaries, and pinning the paths means a future STATE mount one level up
# cannot quietly change which netavark runs as root.
conmon_path = ["/usr/libexec/podman/conmon"]
helper_binaries_dir = ["/usr/libexec/podman"]

[engine.runtimes]
crun = ["/usr/bin/crun"]

[network]
# Custom network definitions must live on writable storage. netavark's rootful
# default is /etc/containers/networks (containers.conf.5, [network]
# network_config_dir: "'/etc/containers/networks' is used as root"), which on
# this image is the sealed read-only root: `podman network create` against it
# reports success yet `podman run --network` cannot find the network it just
# made -- measured on hardware. /var/lib/containers sits on the VAR partition
# beside the storage graph, which is where a device-lifetime network
# definition belongs.
network_config_dir = "/var/lib/containers/networks"

# firewall_driver is deliberately unset, which selects nftables: netavark 2.1.0
# decides it at COMPILE time (build.rs:69 defaults NETAVARK_DEFAULT_FW to
# "nftables") and its FirewallImpl enum has exactly three variants — Firewalld,
# Nftables, Fwnone (src/firewall/mod.rs). The iptables driver was REMOVED in
# 2.x, so there is no fallback to fall back to.
#
# That makes the `nft` binary a hard runtime dependency: netavark calls it
# through the nftables crate, which execs it by name off PATH
# (nftables-0.6.3/src/helper.rs:13, NFT_EXECUTABLE = "nft"). os/rootfs installs
# the nftables package for exactly this, and the os/verify suite asserts the
# binary is present — a dependency reached by exec is invisible to every
# NEEDED-soname check, which is how an image can pass 376 assertions and still
# fail on its first `podman run`.
