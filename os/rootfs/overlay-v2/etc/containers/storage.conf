# Container image and layer storage (PLAN-012).
#
# WHY THIS FILE EXISTS AT ALL. podman ships no storage.conf and falls back to
# built-in defaults: graphroot /var/lib/containers/storage, runroot
# /run/containers/storage. On this appliance /var is the EPHEMERAL partition —
# 512 MiB, and wiped by design — so the defaults would put every pulled image
# somewhere that is both too small and deliberately destroyed. The failure is
# not an error message: containers work, and then one day the partition is
# reset and every image is gone.
#
# DATA is the only growth target on this device: the image assembler creates
# it at 64 MiB and systemd-repart extends it to the end of the disk on first
# boot. It is also where the customer's UI bundles and application data live,
# so container images share a partition with them — a filling-up interaction
# the operator has to be told about, which docs/design/containers.md does.
#
# runroot stays on tmpfs: it holds per-boot state (locks, mount points,
# transient container dirs) and putting it on flash would write to eMMC for
# every container start and leave stale state after an unclean shutdown.

[storage]
driver = "overlay"
graphroot = "/srv/containers/storage"
runroot = "/run/containers/storage"

[storage.options]
# The kernel has CONFIG_OVERLAY_FS=y (board/cx3576/kernel/config, measured
# 2026-08-23), so the native driver is used and fuse-overlayfs is neither
# installed nor needed — it is a rootless-mode component, and PLAN-012 D5
# does not build rootless.
[storage.options.overlay]
mountopt = "nodev"
