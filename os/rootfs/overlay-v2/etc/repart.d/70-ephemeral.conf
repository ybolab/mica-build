# systemd-repart: grow EPHEMERAL (partition 9) to the end of the media.
#
# EPHEMERAL is the last partition, and it backs /var — the only filesystem on
# the device that has to scale with the eMMC. v1 grew the root partition here;
# under layout v2 the root is a fixed-size verity image in a frozen A/B slot
# and must never be resized, so the growth target moved.
#
# This is the seventh and last linux-generic definition, so it matches the
# seventh linux-generic partition on disk: EPHEMERAL. Running repart also
# relocates the backup GPT to the real end of the media, which is why the
# assembled image only reserves a 1 MiB tail.
#
# The filesystem itself is grown online by x-systemd.growfs on the /var entry
# in /etc/fstab; repart only moves the partition boundary.
[Partition]
Type=linux-generic
Weight=1000
