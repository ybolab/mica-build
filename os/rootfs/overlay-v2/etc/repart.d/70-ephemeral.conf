# systemd-repart placeholder for ephemeral (partition 10).
#
# repart pairs definition files with existing partitions by partition type
# UUID: the Nth file of a type matches the Nth on-disk partition of that type.
# Eight v2 partitions share the linux-generic type, so every one of them needs
# a file in disk order or the single "grow" definition would attach itself to
# the wrong partition. This file holds position 7 of 8 in that sequence.
#
# /var lives here and is DISPOSABLE runtime residue: logs, caches, package
# bookkeeping. It is deliberately a FIXED size and does NOT grow — the disk is
# worth spending on /srv (partition 11), not on log space. Nothing that
# matters may live here; see docs/design/ro-root.md section 4.
[Partition]
Type=linux-generic
Weight=0
PaddingWeight=0
