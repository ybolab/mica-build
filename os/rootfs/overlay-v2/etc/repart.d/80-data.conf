# systemd-repart: grow DATA (partition 10) to the end of the media.
#
# DATA backs /srv and holds the application data worth the whole disk, so it is
# the one partition that scales with the eMMC. The growth target has moved
# twice: v1 grew the root, early v2 grew ephemeral (/var), and neither was
# right — the root is a fixed-size verity image in a frozen A/B slot, and /var
# is disposable.
#
# This is the eighth and last linux-generic definition, so it matches the
# eighth linux-generic partition on disk: DATA. Running repart also relocates
# the backup GPT to the real end of the media, which is why the assembled image
# only reserves a 1 MiB tail.
#
# The filesystem itself is grown online by x-systemd.growfs on the /srv entry
# in /etc/fstab; repart only moves the partition boundary.
[Partition]
Type=linux-generic
Weight=1000
