# Fill-up containment for the disposable /var partition.
#
# /var is a fixed-size partition (DATA, at /srv, is the one that grows), so
# unbounded growth here is a real failure mode. journald is already capped by
# Storage=volatile, which keeps the journal in RAM and off this filesystem
# entirely; these two rules cover the remaining unbounded directories.
#
# Ordinary housekeeping, not a garbage collector: systemd-tmpfiles-clean.timer
# applies them daily.
#
# /var/tmp: Debian's own tmpfiles rule ages this at 30d. An appliance has no
# long-lived interactive sessions, so 10d is the more useful default here.
q /var/tmp 1777 root root 10d

# /var/cache: regenerable by definition — apt archives, ldconfig and debconf
# caches. No distro rule ages it, so nothing reclaims it today.
e /var/cache 0755 root root 30d
