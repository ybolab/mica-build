# mos health gate configuration (board-agnostic, installed to
# /etc/mos/health.conf). `key=value` lines only; `#` comments and blank lines
# are ignored. Every key except `require` is optional; the built-in defaults are
# shown.

# THE REQUIRED SET: what this slot must be able to do for the boot to be
# confirmed. One `require=<member>` line per member, from a closed vocabulary
# the gate implements — an unrecognised name is a REFUSAL, not an ignored line.
#
# There is NO built-in default. A file with no `require=` line means the gate
# has no criterion, and it refuses rather than confirming a slot nothing was
# checked on: an empty required set is "always mark good".
#
# The criterion is "can this slot be RECOVERED", not "is this device healthy".
# A failed unit that leaves the device reachable and updatable is REPORTED
# (live-state `health.units`), never fatal — spending a boot credit on it is
# how a working system ends up rolled into a slot that cannot run. PLAN-089
# justifies each member and prices its absence.
#
#   boot-settled  the boot transaction finished (multi-user.target reached).
#                 `degraded` counts: it differs from `running` only in that
#                 some unit failed. `maintenance` does not — nothing is up.
#   mosd          com.mos.mosd1 answers. The only process that talks to RAUC's
#                 D-Bus installer, so without it nothing can install an update.
#   apid          https://127.0.0.1/healthz answers. The only network route in:
#                 the `prod` image profile seeds SSH off, so a device with no
#                 apid needs someone at the serial console.
#
# This file is inside the read-only root, so the set is a build-time decision
# that goes through review, not something set on a device after the fact. An
# image that ships no apid drops that line — and then the gate confirms a slot
# whose only remote route is gone, which is why it is a line and not a default.
require=boot-settled
require=mosd
require=apid

# Seconds to wait for systemd to leave `initializing`/`starting` before the
# state is evaluated. The gate polls, so a healthy boot pays nothing.
settle-sec=60

# Per-probe timeout in seconds.
probe-timeout-sec=10

# /var usage percentage at or above which pressure is reported to mosd as
# `degraded`. This is REPORTED, never fatal: /var is disposable runtime
# residue, and a log flood must not turn into an update rollback.
var-threshold-pct=85
