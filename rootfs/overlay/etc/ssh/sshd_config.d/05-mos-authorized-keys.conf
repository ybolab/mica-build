# Point sshd at the authorized-keys file mosd renders.
#
# STATIC image file, not rendered by mosd, so the image verifier can assert it
# byte-for-byte. mos-seed-state copies /etc/ssh/. onto STATE on first boot, so
# this file lands inside the /mnt/data/state/ssh bind (etc-ssh.mount) and survives an
# A/B update along with the host keys.
#
# Numbered 05 so it sorts before mosd's rendered 10-mos.conf. sshd keeps the
# FIRST value it obtains for a non-repeatable keyword and reads sshd_config.d in
# lexical order, so no later drop-in can override this one. mosd must therefore
# NOT also emit AuthorizedKeysFile in 10-mos.conf, and it does not.
#
# Setting this REPLACES the default locations (.ssh/authorized_keys and
# .ssh/authorized_keys2), which is the point: the mosd-managed file is the
# single source of authorised keys, so a key dropped into /root/.ssh by some
# other path does not silently grant access.
AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u
