# The mos base time-synchronization policy (PLAN-044): adaptive polling
# between 32 and 2048 seconds while synchronized, a 30-second retry while a
# server is unreachable, and the kernel clock saved to disk every 60 seconds.
#
# BASE POLICY, NOT SETTINGS. Nothing in micad, apid or the UI reads or writes
# these values, and there is no pause or enable switch anywhere: the settings
# surface covers NTP servers and the timezone only, and the polling behaviour
# ships pinned here so every image retries and saves the clock the same way.
[Time]
PollIntervalMinSec=32
PollIntervalMaxSec=2048
ConnectionRetrySec=30
SaveIntervalSec=60
