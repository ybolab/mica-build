[package]
name = "mos-sign"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# The crate lives outside the workspace root directory, so the workspace must be
# named explicitly; cargo only auto-discovers a workspace root in a parent dir.
workspace = "../../mosd"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tough = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
